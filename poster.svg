<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" role="img" aria-label="A plug beside a wall outlet">
  <defs>
    <linearGradient id="prong" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e4c675"/>
      <stop offset="1" stop-color="#b9954a"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="480" height="360" fill="none"/>

  <!-- wall plate -->
  <rect x="280" y="70" width="150" height="220" rx="18" fill="#e9e4da"/>
  <rect x="300" y="95" width="110" height="170" rx="14" fill="#f3efe6"/>
  <rect x="330" y="120" width="12" height="42" rx="4" fill="#20242b"/>
  <rect x="378" y="120" width="12" height="42" rx="4" fill="#20242b"/>
  <circle cx="355" cy="205" r="13" fill="#20242b"/>

  <!-- cable -->
  <path d="M120 300 C 80 260, 70 200, 100 150" fill="none" stroke="#2b2f36" stroke-width="14" stroke-linecap="round"/>

  <!-- plug body -->
  <rect x="70" y="110" width="86" height="96" rx="16" fill="#2b2f36"/>
  <rect x="128" y="130" width="10" height="34" rx="3" fill="url(#prong)"/>
  <rect x="148" y="130" width="10" height="34" rx="3" fill="url(#prong)"/>

  <path d="M170 158 L 275 178" stroke="#5fd0ff" stroke-width="3" stroke-dasharray="6 8" opacity="0.7"/>
</svg>
